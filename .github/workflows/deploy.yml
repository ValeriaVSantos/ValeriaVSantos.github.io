name: Deploy to GitHub Pages

on:
  # Roda em todo push pra main
  push:
    branches: [main]
  # Permite rodar manualmente pela aba Actions
  workflow_dispatch:

# Permissões mínimas necessárias pra publicar no Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Só uma execução de Pages por vez; cancela runs em fila
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # ----------- Build -----------
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          # Garante que assets carreguem em /<repo>/ no GitHub Pages
          # Ajuste no vite.config.js: base: '/<nome-do-repo>/'
          NODE_ENV: production

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Vite gera por padrão em ./dist
          path: ./dist

  # ----------- Deploy -----------
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
